version: 2
updates:
  # Phụ thuộc của DỰ ÁN THẬT (kích hoạt khi có package.json). Repo khung chưa có
  # package.json nên mục này im lặng cho tới lúc đó — giữ sẵn để khỏi phải nhớ thêm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Phụ thuộc của CHÍNH bộ khung: các action trong .github/workflows/ đang dùng tag
  # trôi (@v4, @v3) — Dependabot theo dõi để bắt bản mới + bản vá bảo mật.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
